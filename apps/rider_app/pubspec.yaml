name: rider_app
description: Transit rider app — one binary, any agency.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  dio: ^5.7.0
  transit_api_client:
    path: ../../packages/transit_api_client
  transit_design:
    path: ../../packages/transit_design
  transit_maps:
    path: ../../packages/transit_maps
  transit_core:
    path: ../../packages/transit_core
  shared_preferences: ^2.3.0
  geolocator: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  golden_toolkit: ^0.15.0

flutter:
  uses-material-design: true
