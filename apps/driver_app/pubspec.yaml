name: driver_app
description: Transit driver app — always-on shell, zero-touch GPS telemetry.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  dio: ^5.7.0
  supabase_flutter: ^2.6.0
  transit_telemetry:
    path: ../../packages/transit_telemetry
  transit_design:
    path: ../../packages/transit_design
  geolocator: ^13.0.0
  wakelock_plus: ^1.2.8
  flutter_background_service: ^5.0.10
  flutter_local_notifications: ^17.2.3
  connectivity_plus: ^6.0.5
  shared_preferences: ^2.3.0
  device_info_plus: ^11.1.0
  permission_handler: ^11.3.1
  permission_handler_platform_interface: ^4.4.0
  android_intent_plus: ^5.1.0
  package_info_plus: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
