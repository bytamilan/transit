name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "internal-docs/**"
      - "packages/*/README.md"
      - "contracts/openapi.yaml"
      - "apps/*/test/golden/goldens/**"
  workflow_dispatch: {}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs-site/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python3 docs-site/scripts/sync_docs.py
      - run: docs-site/scripts/build_api_docs.sh
      - run: mkdocs build --strict -f docs-site/mkdocs.yml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
