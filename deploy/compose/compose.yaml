name: transit

services:
  db:
    image: supabase/postgres:15.8.1.044
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot: the supabase/postgres image's own init scripts create
  # `authenticator`/`supabase_auth_admin` as LOGIN roles but never set a
  # password on either (confirmed by reading its init-scripts — every
  # other role's password comes from POSTGRES_PASSWORD via its migrate.sh,
  # these two don't), and never creates the `_realtime` schema Realtime's
  # DB_AFTER_CONNECT_QUERY expects to already exist. Only needed for the
  # `supabase` profile (rest/auth/realtime) — `db`/`api`/etc. never touch
  # these roles. `supabase_admin` (not `postgres`) is the actual superuser
  # in this image, so this connects as that.
  db-init:
    profiles: ["supabase"]
    image: supabase/postgres:15.8.1.044
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    entrypoint:
      - sh
      - -c
      - |
        psql -h db -U supabase_admin -d ${POSTGRES_DB:-postgres} -v ON_ERROR_STOP=1 -c "
          ALTER ROLE authenticator WITH PASSWORD '${POSTGRES_PASSWORD:-postgres}';
          ALTER ROLE supabase_auth_admin WITH PASSWORD '${POSTGRES_PASSWORD:-postgres}';
          CREATE SCHEMA IF NOT EXISTS _realtime;
          GRANT ALL ON SCHEMA _realtime TO supabase_admin;
        "
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ../../services/api
    environment:
      API_ADDR: ":8080"
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-postgres}?sslmode=disable&search_path=transit,public,extensions,auth
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:8000/auth}
      GOTRUE_JWT_AUD: authenticated
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3002,http://127.0.0.1:3002,http://localhost:3003,http://127.0.0.1:3003,http://localhost:3004,http://127.0.0.1:3004}
      GOTRUE_INTERNAL_URL: ${GOTRUE_INTERNAL_URL:-http://auth:9999}
      # Driver invitations use GoTrue's admin API. `make dev-full` supplies
      # a short-lived service_role JWT signed with the same JWT_SECRET.
      GOTRUE_ADMIN_URL: ${GOTRUE_ADMIN_URL:-http://auth:9999}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  ingestor:
    build:
      context: ../../services/api
    command: ["/ingestor"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-postgres}?sslmode=disable&search_path=transit,public,extensions,auth
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RELOAD_INTERVAL: ${RELOAD_INTERVAL:-5m}
    depends_on:
      db:
        condition: service_healthy
    # The scheduler treats its first query failing (e.g. migrations not
    # applied yet — `make db.migrate` is a separate manual step from
    # `make dev`, see docs/onboarding/) as fatal and exits; without a
    # restart policy the container then stays dead even after the schema
    # shows up, needing a manual `docker compose restart ingestor`.
    restart: on-failure

  # Phase 8: reprocesses open duties' raw ping traces into authoritative
  # stop_events/vehicle_trips, and purges pings past the retention window.
  tracker:
    build:
      context: ../../services/api
    command: ["/tracker"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-postgres}?sslmode=disable&search_path=transit,public,extensions,auth
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRACKER_TICK_INTERVAL: ${TRACKER_TICK_INTERVAL:-15s}
      VEHICLE_PINGS_RETENTION_DAYS: ${VEHICLE_PINGS_RETENTION_DAYS:-7}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  # Phase 10: builds GTFS.zip per agency on a schedule and serves it, plus a
  # GTFS-RT ServiceAlerts stub. VehiclePositions/TripUpdates stay on `api`
  # (Phase 8) — see cmd/exporter's package doc for why they aren't
  # duplicated here. Its own volume so an export survives a container
  # restart instead of `/gtfs.zip` 404ing until the next tick.
  exporter:
    build:
      context: ../../services/api
    command: ["/exporter"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-postgres}?sslmode=disable&search_path=transit,public,extensions,auth
      LOG_LEVEL: ${LOG_LEVEL:-info}
      EXPORT_INTERVAL: ${EXPORT_INTERVAL:-15m}
      EXPORT_DIR: /data/exports
      EXPORTER_ADDR: ":8090"
    ports:
      - "8090:8090"
    volumes:
      - exporter_data:/data/exports
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  # Supabase Auth (GoTrue) — the JWT issuer used by the Flutter apps and portal.
  # Wired to the same Postgres instance; a full custom-claims hook lands in Phase 2.
  auth:
    profiles: ["supabase"]
    image: supabase/gotrue:v2.167.0
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:8000/auth}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-postgres}?sslmode=disable
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-*}
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL:-http://localhost:8000/auth}
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED: "true"
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI: pg-functions://postgres/transit/custom_access_token_hook
    ports:
      - "9999:9999"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9999/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # PostgREST — direct REST/SQL over the Postgres schema. Disabled until the
  # anon/authenticated roles and full RLS matrix are set up in Phase 2.
  rest:
    profiles: ["supabase"]
    image: postgrest/postgrest:v12.2.3
    environment:
      # PostgREST's connection-string parser rejects search_path as a URI
      # query parameter (unlike the Go API's pgx-based DATABASE_URL, which
      # accepts it) — the schema/search-path is configured via the
      # dedicated PGRST_DB_SCHEMAS/PGRST_DB_EXTRA_SEARCH_PATH vars below
      # instead.
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-postgres}?sslmode=disable
      PGRST_DB_SCHEMAS: transit
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_EXTRA_SEARCH_PATH: transit,public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_ADMIN_SERVER_HOST: localhost
    ports:
      - "3000:3000"
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      # postgrest/postgrest has neither wget nor curl — bash (confirmed
      # present) with /dev/tcp is the only HTTP-capable tool available
      # inside the container. Hits the admin server's /live endpoint
      # (PGRST_ADMIN_SERVER_PORT above), which is what PostgREST's own
      # docs recommend for liveness — the root "/" path is the REST API
      # itself, not a health endpoint, and returns an empty/error response
      # until real tables are exposed via PGRST_DB_SCHEMAS.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/3001 && printf \"GET /live HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Supabase Realtime — listens to Postgres changes for the dispatch board.
  # Healthcheck only in Phase 1; no active consumers yet.
  realtime:
    profiles: ["supabase"]
    image: supabase/realtime:v2.34.2
    environment:
      PORT: "4000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-postgres}
      DB_SSL: "false"
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      # AES-128 key (must be exactly 16 bytes) Realtime uses to encrypt
      # tenant secrets (e.g. API_JWT_SECRET below) at rest in its own
      # tenants/extensions tables — without it, self-host tenant seeding
      # crashes with "Bad key" trying to encrypt with a nil key. Same
      # placeholder value Supabase's own self-hosting .env.example uses.
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:-supabaserealtime}
      API_JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-change-me-in-production-must-be-at-least-64-characters-long}
      METRICS_JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      # supabase/realtime has no wget/curl either — same bash /dev/tcp
      # approach as rest's healthcheck above. No path here returns 2xx
      # without an authenticated tenant request (this deployment is a
      # stub with no active consumers yet, per the comment above), so
      # this only proves Cowboy is up and answering HTTP at all — any
      # response (even a 404/500) means the process is alive; a
      # connection failure means it's actually down.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/4000 && printf \"GET / HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q HTTP'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  db_data:
  exporter_data:
