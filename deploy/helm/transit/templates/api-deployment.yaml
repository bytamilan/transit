apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "transit.fullname" . }}-api
  labels:
    {{- include "transit.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "transit.selectorLabels" (dict "Release" .Release "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "transit.selectorLabels" (dict "Release" .Release "component" "api") | nindent 8 }}
    spec:
      containers:
        - name: api
          image: {{ include "transit.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/server"]
          ports:
            - containerPort: 8080
          env:
            {{- include "transit.commonEnv" . | nindent 12 }}
            - name: API_ADDR
              value: {{ .Values.config.apiAddr | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: JWT_SECRET
            - name: GOTRUE_ADMIN_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: GOTRUE_ADMIN_URL
                  optional: true
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: SUPABASE_SERVICE_ROLE_KEY
                  optional: true
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "transit.fullname" . }}-api
  labels:
    {{- include "transit.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "transit.selectorLabels" (dict "Release" .Release "component" "api") | nindent 4 }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: 8080
